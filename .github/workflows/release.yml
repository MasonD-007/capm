name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Only pushes to main release; a green PR run must not.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are the full commit SHA (what k3s/ pins) plus latest.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/masond-007/capm/backend:${{ env.SHA }}
            ghcr.io/masond-007/capm/backend:latest
          # Separate scopes: a shared scope makes the builds overwrite each other's cache.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Baked into the browser bundle at build time.
          build-args: |
            NEXT_PUBLIC_API_URL=https://capm.masondrake.dev
          tags: |
            ghcr.io/masond-007/capm/frontend:${{ env.SHA }}
            ghcr.io/masond-007/capm/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backup
        uses: docker/build-push-action@v6
        with:
          context: ./backup
          push: true
          tags: |
            ghcr.io/masond-007/capm/backup:${{ env.SHA }}
            ghcr.io/masond-007/capm/backup:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  cli:
    name: Build and Publish CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      # Shared with cli-release.yml; tested by scripts/test-cli-release.sh.
      - name: Cross-compile
        run: bash scripts/build-cli.sh "${SHA}" dist

      # Per-commit builds are PRERELEASES and never "latest": the installer and
      # `capm self-update` download from releases/latest, which must only move
      # when a vX.Y.Z tag is cut (see cli-release.yml). Until the first tag the
      # release that is already "latest" stays latest, because GitHub only
      # moves that label on --latest (or when a non-prerelease is created
      # without --latest=false). Safe to re-run for the same SHA: an existing
      # release (possibly left partial by a failed run) gets its assets
      # replaced as one consistent set and its flags are left as they are.
      - name: Publish release
        run: |
          set -eu
          if gh release view "cli-${SHA}" >/dev/null 2>&1; then
            gh release upload "cli-${SHA}" --clobber dist/capm-* dist/checksums.txt
            exit 0
          fi
          gh release create "cli-${SHA}" \
            --target "${SHA}" \
            --prerelease \
            --latest=false \
            --title "capm CLI ${SHA:0:7} (per-commit build)" \
            --notes "Per-commit capm CLI build from ${SHA}; not the recommended release. Install the latest tagged release: curl -fsSL https://capm.masondrake.dev/install.sh | sh" \
            dist/capm-darwin-amd64 dist/capm-darwin-arm64 \
            dist/capm-linux-amd64 dist/capm-linux-arm64 dist/checksums.txt
