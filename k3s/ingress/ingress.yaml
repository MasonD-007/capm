apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capm-ingress
  namespace: capm
spec:
  # TLS ends at Cloudflare; the tunnel forwards plain HTTP to Traefik.
  ingressClassName: traefik
  rules:
    - host: capm.masondrake.dev
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
