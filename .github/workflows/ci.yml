name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Deploy commits only touch k3s/**; they must not start another release.
    paths-ignore:
      - 'k3s/**'

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Test
        run: |
          for m in manifest backend cli; do
            (cd "$m" && go vet ./... && go test ./...)
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backup:
    name: Backup image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash backup/test.sh

  install-script:
    name: Install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-install.sh
