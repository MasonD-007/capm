services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      # Server-side fetches use the compose network; the browser uses NEXT_PUBLIC_API_URL.
      API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
