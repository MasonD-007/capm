name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    # Only pushes to main release; a green PR run must not.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are the full commit SHA (what k3s/ pins) plus latest.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/masond-007/capm/backend:${{ env.SHA }}
            ghcr.io/masond-007/capm/backend:latest
          # Separate scopes: a shared scope makes the builds overwrite each other's cache.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Baked into the browser bundle at build time.
          build-args: |
            NEXT_PUBLIC_API_URL=https://capm.masondrake.dev
          tags: |
            ghcr.io/masond-007/capm/frontend:${{ env.SHA }}
            ghcr.io/masond-007/capm/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backup
        uses: docker/build-push-action@v6
        with:
          context: ./backup
          push: true
          tags: |
            ghcr.io/masond-007/capm/backup:${{ env.SHA }}
            ghcr.io/masond-007/capm/backup:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
